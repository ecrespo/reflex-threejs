name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Run every JavaScript action on the Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Syntax check
        run: python -m py_compile custom_components/reflex_threejs/*.py

      - name: Tests
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Regenerate type stubs
        run: python scripts/gen_pyi.py

      - name: Verify committed stubs are up to date
        run: git diff --exit-code -- 'custom_components/reflex_threejs/*.pyi'

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

  demo:
    # Compile the demo app end to end (Reflex 0.10 needs Node >= 22.22).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install demo dependencies
        working-directory: reflex_threejs_demo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export the demo frontend
        working-directory: reflex_threejs_demo
        run: reflex export --frontend-only --no-zip
