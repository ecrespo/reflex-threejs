name: Publish to PyPI

# Releases are cut by pushing a `vX.Y.Z` tag on main. The tag must match
# `version` in pyproject.toml. Uploads use PyPI Trusted Publishing (OIDC), so no
# API token is stored in the repository.
on:
  push:
    tags: ["v*.*.*"]

env:
  # Run every JavaScript action on the Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the tag is on main and matches pyproject.toml
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Lint and test
        run: |
          ruff check .
          pytest -q

      - name: Regenerate and verify type stubs
        run: |
          python scripts/gen_pyi.py
          git diff --exit-code -- 'custom_components/reflex_threejs/*.pyi'

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-threejs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Pinned to a commit SHA: this job holds the OIDC token used to publish.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Release on PyPI: https://pypi.org/project/reflex-threejs/${GITHUB_REF_NAME#v}/"
