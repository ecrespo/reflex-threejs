[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-threejs"
version = "0.1.0"
description = "React Three Fiber and drei (three.js) wrapped as Reflex components."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = ["reflex", "threejs", "three", "react-three-fiber", "drei", "3d", "webgl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Reflex",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = ["reflex>=0.7.0"]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-threejs"
Repository = "https://github.com/ecrespo/reflex-threejs"
Issues = "https://github.com/ecrespo/reflex-threejs/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.0"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
