[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-threejs"
version = "0.2.0"
description = "React Three Fiber and drei (three.js) wrapped as Reflex components."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "threejs",
    "three",
    "react-three-fiber",
    "drei",
    "3d",
    "webgl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = ["reflex>=0.7.0"]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-threejs"
Repository = "https://github.com/ecrespo/reflex-threejs"
Issues = "https://github.com/ecrespo/reflex-threejs/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=5.0",
    "trove-classifiers>=2024.1.1",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
# Ship the generated type stubs (regenerated by `reflex component build`) and
# the PEP 561 marker so editors and type checkers pick up the wrapped API.
reflex_threejs = ["*.pyi", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated type stubs are build artifacts (produced by `reflex component build`
# / the PyiGenerator); they are not hand-edited and are excluded from linting.
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions document themselves through their names and assertions; the
# pydocstyle rules add noise without value in the suite.
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
# The component package lives under ``custom_components`` (see
# ``[tool.setuptools.packages.find]``). Putting it on the path lets the suite
# run without an editable install, both locally and in CI.
pythonpath = ["custom_components"]
testpaths = ["tests"]
